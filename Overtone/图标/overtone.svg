<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Overtone">
  <title>Overtone</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#323238"/>
      <stop offset="1" stop-color="#131317"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形基底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#tile)"/>

  <!-- 泛音列：自左向右 频率升高、振幅衰减 -->
  <g fill="#FA2D48">
    <rect x="202" y="246" width="132" height="532" rx="66" ry="66" opacity="1"/>
    <rect x="446" y="379" width="132" height="399" rx="66" ry="66" opacity="0.8"/>
    <rect x="690" y="512" width="132" height="266" rx="66" ry="66" opacity="0.62"/>
  </g>
</svg>
