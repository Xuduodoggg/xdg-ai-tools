  a.addEventListener('timeupdate',()=>{
    if(a.duration) seekFader.set(a.currentTime/a.duration*100,true);
    $('#tCur').textContent=fmtTime(a.currentTime);
  });
  a.addEventListener('loadedmetadata',()=>{
    if(curTrack && a.duration && isFinite(a.duration)){
      if(!curTrack.duration || Math.abs(curTrack.duration-a.duration)>1){ curTrack.duration=a.duration; renderList(); }
    }
    renderPlayerBar();
  });
  a.addEventListener('play',()=>{ renderHero(); renderPlayerBar(); renderList(); });
  a.addEventListener('pause',()=>{ renderHero(); renderPlayerBar(); MediaSessionSync(); });
  a.addEventListener('ended',()=>nextTrack(true));
  a.addEventListener('error',()=>{ if(curTrack) toast('播放出错，已跳过：'+esc(trackTitle(curTrack)),2600); });

  // 系统媒体键
  if('mediaSession' in navigator){
    const hs={
      play:()=>{ Engine.resume(); a.play().catch(()=>{}); },
      pause:()=>a.pause(),
      stop:()=>a.pause(),
      previoustrack:prevTrack,
      nexttrack:()=>nextTrack(false),
      seekbackward:()=>{ a.currentTime=Math.max(0,a.currentTime-10); },
      seekforward:()=>{ a.currentTime=Math.min(a.duration||0,a.currentTime+10); }
    };
    Object.keys(hs).forEach(k=>{ try{ navigator.mediaSession.setActionHandler(k,hs[k]); }catch(e){} });
  }

  // 键盘快捷键
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||e.target.isContentEditable) return;
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    else if(e.key==='ArrowRight'){ a.currentTime=Math.min(a.duration||0,a.currentTime+5); }
    else if(e.key==='ArrowLeft'){ a.currentTime=Math.max(0,a.currentTime-5); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); volFader.set(Math.min(100,player.volume+5)); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); volFader.set(Math.max(0,player.volume-5)); }
    else if(e.key==='n'||e.key==='N'){ nextTrack(false); }
    else if(e.key==='p'||e.key==='P'){ prevTrack(); }
    else if(e.key==='m'||e.key==='M'){ player.muted=!player.muted; Engine.applyAll(); renderPlayerBar(); }
    else if(e.key==='Escape'){ openFx(false); hideCtx(); }
  });

  // 拖拽导入（支持文件夹）
  ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); }));
  document.addEventListener('drop',async e=>{
    e.preventDefault();
    const dt=e.dataTransfer; if(!dt) return;
    const out=[], entries=[];
    if(dt.items){
      for(const it of dt.items){
        const en=it.webkitGetAsEntry && it.webkitGetAsEntry();
        if(en) entries.push(en);
      }
    }
    if(entries.length){ for(const en of entries) await readEntry(en,out); }
    else out.push(...Array.from(dt.files||[]));
    const n=pushFiles(out);
    if(!n) return toast('没有识别到支持的音频文件');
    toast('<span class="spin"></span> 正在读取 '+n+' 个文件…',600000);
    await drainQueue();
    toast('已导入 '+n+' 首歌曲');
  });

  // 全局点击收起菜单
  document.addEventListener('click',e=>{ if(!e.target.closest('#ctxMenu')) hideCtx(); });
  window.addEventListener('blur',hideCtx);
  window.addEventListener('resize',()=>{ hideCtx(); clearTimeout(window.__rz); window.__rz=setTimeout(drawEqCurve,180); });
}

function paintThemeBtn(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  $('#themeBtn').innerHTML=svg(dark?'sun':'moon',17);
  $('#themeBtn').title=dark?'切换到浅色':'切换到深色';
}

/* ---------------- 启动 ---------------- */
async function boot(){
  document.documentElement.setAttribute('data-theme', savedLS('lp.theme','light'));
  paintThemeBtn();
  buildEqUI();
  buildFxUI();
  syncEqUI();
  setBassUI();
  syncFxLabels();
  bind();
  setMode(player.mode);
  volFader.set(player.volume,true);

  // 先恢复上次的资料库清单与已解析好的标签（此时可能还没有文件访问权限）
  await MetaStore.load();
  const restored=restoreFromIndex();
  refreshAll();
  renderHero();
  renderPlayerBar();
  drawViz();
  if(restored) toast('已恢复上次的资料库，共 '+restored+' 首', 2400);

  // 再尝试自动恢复上次使用的文件夹（有权限就直接扫描，没权限则提示重新授权）
  try{
    const h=await IDB.get('dirHandle');
    if(h){
      lastDir=h;   // 缓存起来，供「重新授权」在点击手势内同步发起权限请求
      const p=await h.queryPermission({mode:'read'});
      if(p==='granted'){ await scanHandle(h); }
      else { $('#restoreBtn').hidden=false; }
    }
  }catch(e){ /* 忽略 */ }

  // 离开页面前尽力把资料库索引写盘
  window.addEventListener('beforeunload',()=>{ try{ MetaStore.flush(); }catch(e){} });
}

boot();
</script>
<script>
/* PWA：注册 Service Worker（仅 https / localhost 下生效，file:// 打开时自动跳过） */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var host = location.hostname;
  if(location.protocol !== 'https:' && host !== 'localhost' && host !== '127.0.0.1') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(function(reg){
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            if(typeof toast === 'function') toast('已下载新版本，刷新页面即可生效', 4000);
          }
        });
      });
    }).catch(function(){ /* 注册失败不影响正常使用 */ });
  });
})();
</script>
